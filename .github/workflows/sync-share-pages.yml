name: Sync share pages

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate devotional share pages
        id: gen_devocionales
        run: node scripts/generate-share-pages.mjs
        continue-on-error: true

      - name: Generate invitee share pages
        id: gen_invitadas
        run: node scripts/generate-invitee-share-pages.mjs
        continue-on-error: true

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add d/ i/
          if git diff --cached --quiet; then
            echo "Sin cambios en las páginas de vista previa."
          else
            git commit -m "Sync share pages"
            git push
          fi

      - name: Fail the job if a generator errored
        if: steps.gen_devocionales.outcome == 'failure' || steps.gen_invitadas.outcome == 'failure'
        run: exit 1
