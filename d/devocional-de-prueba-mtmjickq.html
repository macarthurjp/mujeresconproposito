  <meta name="description" content="Il faut toutefois distinguer le pays de résidence de la nationalité. Tous les frontaliers vivant en France, en Allemagne ou en Belgique ne possèdent pas la nationalité du pays où ils résident. Depuis des années, des Luxembourgeois et des ressortissants d’autres pays s’installent eux aussi dans les régions frontalières, notamment parce que les prix de l’immobilier au Luxembourg sont devenus trop élevés. Parmi les frontaliers figurent ainsi de nombreux Luxembourgeois, Portugais, Italiens et autres nationalités." />
