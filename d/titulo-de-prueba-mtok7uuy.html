  <meta name="description" content="Vendredi soir, vers 22h, la police a été informée qu’une voiture roulait anormalement lentement sur l’A1 en direction de l’A7. Deux patrouilles ont tenté de l’intercepter et l’ont finalement immobilisé au Merscherberg à Mersch. Le conducteur a peiné à souffler dans l’alcootest mais le résultat s’est révélé finalement positif, avec un taux d’alcoolémie élevé. Son permis lui a été confisqué." />
