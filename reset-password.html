<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambiar contraseña — Mujeres con Propósito</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=2" />
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260831-premium-login-1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="assets/css/brand.css?v=20261115-1" />
  <link rel="stylesheet" href="assets/css/app-parity.css?v=20261117-ui-polish-1" />
  <style>
    .private-access-card.reset-done { text-align: center; animation: resetRise .5s cubic-bezier(.22,1,.36,1); }
    .reset-check { width: 64px; height: 64px; margin: 6px auto 16px; border-radius: 50%; background: #2e7d4f; color: #fff; display: grid; place-items: center; box-shadow: 0 12px 26px rgba(46,125,79,.28); animation: resetPop .5s .15s both cubic-bezier(.34,1.56,.64,1); }
    .reset-check svg { width: 32px !important; height: 32px !important; }
    .reset-done p { margin: 8px 0 22px; }
    .reset-home-btn { display: flex !important; align-items: center; justify-content: center; width: 100%; min-height: 52px; text-decoration: none; }
    .reset-panel-link { display: inline-block; margin-top: 14px; color: #a64b43; font-weight: 600; font-size: 14px; text-decoration: none; }
    .reset-bar { height: 3px; border-radius: 3px; background: #f3e6e3; overflow: hidden; margin-top: 18px; }
    .reset-bar span { display: block; height: 100%; background: #a64b43; transform-origin: left; animation: resetShrink 4s linear forwards; }
    @keyframes resetRise { from { opacity: 0; transform: translateY(10px); } }
    @keyframes resetPop { from { opacity: 0; transform: scale(.4); } }
    @keyframes resetShrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { .reset-done, .reset-check, .reset-bar span { animation: none; } }
  </style>
</head>
<body class="mcp-brand private-locked">
  <section class="private-access-screen">
    <div class="private-access-card">
      <img class="private-access-brand" src="assets/images/logo.webp?v=2" alt="Mujeres con Propósito" />
      <span class="private-access-eyebrow">Acceso seguro</span>
      <h3>Cambiar contraseña</h3>
      <p>Escribe una contraseña nueva para tu cuenta.</p>

      <input type="password" id="newPassword" placeholder="Nueva contraseña" autocomplete="new-password" />
      <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" autocomplete="new-password" />

      <div class="private-access-actions private-access-actions-single">
        <button type="button" class="btn" id="savePasswordBtn">Guardar</button>
      </div>
      <div id="resetPasswordMsg" class="form-message" style="display:none;"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/reset-password.js?v=20261117-1"></script>
</body>
</html>
