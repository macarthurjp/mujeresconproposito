<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambiar contraseña — Mujeres con Propósito</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
  <link rel="stylesheet" href="assets/css/dashboard.css?v=20260831-premium-login-1" />
</head>
<body class="private-locked">
  <section class="private-access-screen">
    <div class="private-access-card">
      <img class="private-access-brand" src="assets/images/logo.webp" alt="Mujeres con Propósito" />
      <span class="private-access-eyebrow">Acceso seguro</span>
      <h3>Cambiar contraseña</h3>
      <p>Escribe una contraseña nueva para tu cuenta.</p>

      <input type="password" id="newPassword" placeholder="Nueva contraseña" autocomplete="new-password" />
      <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" autocomplete="new-password" />

      <div class="private-access-actions private-access-actions-single">
        <button type="button" class="btn" id="savePasswordBtn">Guardar</button>
      </div>
      <div id="resetPasswordMsg" class="form-message" style="display:none;"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/reset-password.js?v=20260831-save-only-1"></script>
</body>
</html>
