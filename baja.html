<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Avisos por correo — Mujeres con Propósito</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#faf5f4">
  <link rel="icon" href="assets/images/favicon.ico?v=3" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png?v=3" />
  <link rel="manifest" href="site.webmanifest?v=3" />
  <style>
    :root { --ink:#3f2623; --muted:#6d5250; --wine:#a64b43; --wine-dark:#8f3f38; --blush:#f9e1dc; --bg:#faf5f4; --card:#fff; --line:rgba(60,40,38,.10);
      --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --serif:Georgia,"New York","Times New Roman",serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(120% 80% at 50% 0%, #fdeee9 0%, var(--blush) 40%, var(--bg) 100%); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    .card { width: min(100%, 460px); background: var(--card); border-radius: 26px; padding: 34px 28px 28px; text-align: center; box-shadow: 0 1px 2px rgba(63,38,35,.04), 0 18px 44px rgba(63,38,35,.10); }
    .logo { width: 60px; height: 60px; border-radius: 16px; box-shadow: 0 6px 18px rgba(166,75,67,.2); }
    .brand { display: block; margin: 10px 0 22px; font-family: var(--serif); font-size: 17px; color: var(--ink); text-decoration: none; }
    h1 { margin: 0 0 10px; font-family: var(--serif); font-weight: 400; font-size: 28px; line-height: 1.2; }
    p { margin: 0 0 22px; color: var(--muted); font-size: 16px; line-height: 1.55; }
    button { width: 100%; min-height: 50px; border: 0; border-radius: 999px; background: var(--wine); color: #fff; font: 700 16px var(--sans); cursor: pointer; }
    button:hover { background: var(--wine-dark); }
    button:disabled { opacity: .6; cursor: default; }
    .home { display: inline-block; margin-top: 16px; color: var(--wine); font-size: 15px; font-weight: 600; text-decoration: none; }
    .msg-err { color: #b8473e; }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <img class="logo" src="assets/images/apple-touch-icon.png?v=3" alt="" />
    <a class="brand" href="/">Mujeres con Propósito</a>
    <div id="ask">
      <h1>Avisos por correo</h1>
      <p>¿Quieres dejar de recibir los avisos de la comunidad por correo? Seguirás registrada y podrás recibir los avisos en la app.</p>
      <button type="button" id="confirm">Dejar de recibir avisos por correo</button>
    </div>
    <div id="done" hidden>
      <h1>Listo</h1>
      <p>Ya no recibirás los avisos de la comunidad por correo. Si cambias de idea, escríbenos a <a href="mailto:contacto@mcp930.org">contacto@mcp930.org</a>.</p>
    </div>
    <p id="error" class="msg-err" hidden></p>
    <a class="home" href="/">Ir a mcp930.org</a>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var e = params.get("e"), s = params.get("s");
      var error = document.getElementById("error");
      var fail = function (text) { error.textContent = text; error.hidden = false; };
      if (!e || !s) { document.getElementById("ask").hidden = true; fail("Este enlace no es válido. Usa el enlace que aparece en el correo."); return; }
      document.getElementById("confirm").addEventListener("click", function () {
        var button = this; button.disabled = true; error.hidden = true;
        fetch("https://jkunywiyiyidhyodsbfh.supabase.co/functions/v1/email-unsubscribe", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ e: e, s: s })
        }).then(function (r) { return r.json(); }).then(function (data) {
          if (!data || !data.ok) throw new Error(data && data.error || "");
          document.getElementById("ask").hidden = true; document.getElementById("done").hidden = false;
        }).catch(function (err) { button.disabled = false; fail(err.message || "No se pudo completar la baja. Inténtalo de nuevo."); });
      });
    })();
  </script>
</body>
</html>
