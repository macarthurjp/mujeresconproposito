<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg?v=2" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png?v=2" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Verificación · Mujeres con Propósito</title>
  <!--
    Used only by the mobile app: it opens this page in a WebView so Cloudflare
    Turnstile runs on mcp930.org (the hostname submit-join accepts) and posts
    the resulting token back to the app.
  -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=mcpReady&render=explicit" async defer></script>
  <style>
    html, body { margin: 0; height: 100%; background: #fff7f6; font-family: -apple-system, system-ui, sans-serif; color: #3f2623; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; box-sizing: border-box; text-align: center; }
    p { margin: 0; font-size: 15px; color: #6d5250; }
  </style>
</head>
<body>
  <main>
    <p>Verificando que eres una persona…</p>
    <div id="widget"></div>
  </main>
  <script>
    var FALLBACK_URL = "https://jkunywiyiyidhyodsbfh.supabase.co/functions/v1/form-fallback-token";
    var ANON_KEY = "sb_publishable_To7eDo0ZnOqm9AjlkJ7u6A_pNMFvRjX";
    var isLocalHost = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
    var action = new URLSearchParams(location.search).get("action") === "contact" ? "contact" : "join";
    var widgetId = null, failures = 0, done = false, watchdog = null;

    function send(message) {
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify(message));
    }
    function setStatus(text) { var p = document.querySelector("main p"); if (p) p.textContent = text; }

    // When Turnstile cannot complete inside the app WebView, ask the server for a
    // single-use, rate-limited token so the person can still send the form.
    function fallback(code) {
      if (done) return;
      done = true;
      clearTimeout(watchdog);
      if (isLocalHost) {
        setStatus("La verificación automática no está configurada para pruebas locales.");
        send({ type: "turnstile-error", code: "local-verification-unavailable" });
        return;
      }
      setStatus("Completando la verificación…");
      fetch(FALLBACK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY },
        body: JSON.stringify({ action: action, code: String(code || "") })
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.ok && data.token) send({ type: "turnstile", token: data.token });
          else send({ type: "turnstile-error", code: String(code || "") });
        })
        .catch(function () { send({ type: "turnstile-error", code: String(code || "") }); });
    }

    function mcpReady() {
      widgetId = window.turnstile.render("#widget", {
        sitekey: "0x4AAAAAAEh_oJLzQvnRIJsH",
        action: action,
        retry: "auto",
        "refresh-expired": "auto",
        callback: function (token) {
          if (done) return;
          done = true;
          clearTimeout(watchdog);
          send({ type: "turnstile", token: token });
        },
        "error-callback": function (code) {
          failures += 1;
          if (failures < 2) {
            setStatus("Reintentando la verificación…");
            try { window.turnstile.reset(widgetId); } catch (e) { fallback(code); }
          } else {
            fallback(code);
          }
          return true; // handled: do not let Turnstile throw
        },
        "expired-callback": function () { try { window.turnstile.reset(widgetId); } catch (e) {} }
      });
      // If nothing happens in a reasonable time, do not leave the person waiting.
      watchdog = setTimeout(function () { fallback("timeout"); }, 25000);
    }
    // If the Turnstile script itself cannot load, fall back too.
    setTimeout(function () { if (!window.turnstile) fallback("script-not-loaded"); }, 12000);
  </script>
</body>
</html>
